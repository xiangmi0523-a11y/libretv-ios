<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>fullscreen test</title>
<style>
  html, body { margin: 0; background: #000; color: #fff; font: 14px -apple-system, sans-serif; }
  #box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  #box video { width: 100%; height: 100%; display: block; }
  #box:fullscreen video, #box:-webkit-full-screen video { width: 100%; height: 100%; }
</style>
</head>
<body>
<!-- 只用于 CI 模拟器测试：本机生成的测试画面（彩条），模拟 LibreTV 播放器用 hls.js 播放 + 全屏 -->
<div id="box"><video id="v" playsinline webkit-playsinline autoplay crossorigin="anonymous"></video></div>
<p id="log"></p>
<script src="hls.min.js"></script>
<script>
  const mode = new URLSearchParams(location.search).get('mode') || 'native';
  const v = document.getElementById('v');
  const box = document.getElementById('box');
  const report = (msg) => {
    document.getElementById('log').textContent += msg + '\n';
    fetch('/report?' + new URLSearchParams({ mode, msg }), { cache: 'no-store' }).catch(() => {});
  };
  const src = 'hls/index.m3u8';
  let path = 'native-hls';
  if (window.Hls && Hls.isSupported()) {
    path = (window.ManagedMediaSource ? 'hls.js-managed-mse' : 'hls.js-mse');
    const hls = new Hls();
    hls.on(Hls.Events.ERROR, (_e, d) => { if (d.fatal) report('hls-fatal ' + d.type + ' ' + d.details); });
    hls.loadSource(src);
    hls.attachMedia(v);
  } else {
    v.src = src;
  }
  report('path ' + path);
  v.addEventListener('playing', () => report('playing ' + v.videoWidth + 'x' + v.videoHeight));
  v.addEventListener('error', () => report('video-error ' + (v.error && v.error.code)));
  v.play().catch((e) => report('play-rejected ' + e.name));
  addEventListener('resize', () => report('resize ' + innerWidth + 'x' + innerHeight));
  document.addEventListener('fullscreenchange', () => report('fullscreenchange ' + !!document.fullscreenElement));
  document.addEventListener('webkitfullscreenchange', () => report('webkitfullscreenchange'));
  v.addEventListener('webkitbeginfullscreen', () => report('begin-native-fullscreen'));
  v.addEventListener('webkitendfullscreen', () => report('end-native-fullscreen'));

  // 与 ArtPlayer 一致：页面支持元素全屏就全屏外层容器，否则用 iOS 原生视频全屏
  window.ltvTestEnterFullscreen = () => {
    try {
      if (mode === 'element' && document.fullscreenEnabled) {
        box.requestFullscreen().then(() => report('fs-ok element'), (e) => report('fs-err element ' + e.name + ' ' + e.message));
      } else if (v.webkitSupportsFullscreen) {
        v.webkitEnterFullscreen();
        report('fs-ok native');
      } else {
        report('fs-err no-fullscreen-api fullscreenEnabled=' + document.fullscreenEnabled);
      }
    } catch (e) {
      report('fs-err ' + e.name + ' ' + e.message);
    }
  };
</script>
</body>
</html>
