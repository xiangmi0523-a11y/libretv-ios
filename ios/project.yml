name: LibreTV
options:
  bundleIdPrefix: com.xiangmi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  LibreTV:
    type: application
    platform: iOS
    sources:
      - path: LibreTV
        excludes: ["Info.plist"]
      # 由 scripts/build-node-bundle.sh 生成：LibreTV 的 Next.js standalone 产物 + 启动器，作为文件夹引用原样拷进 App
      - path: nodejs-project
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/NodeMobile.xcframework
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_NAME: LibreTV
        PRODUCT_BUNDLE_IDENTIFIER: com.xiangmi.libretv
        INFOPLIST_FILE: LibreTV/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "2.24.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        DEBUG_INFORMATION_FORMAT: dwarf
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme: {}
